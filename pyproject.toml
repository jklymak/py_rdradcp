[project]
name = "py_rdradcp"
version = "0.1.0"
description = "Reader for Teledyne RDI PD0 (Workhorse/BB) ADCP raw binary files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "xarray>=2024.10"]

[project.optional-dependencies]
netcdf = ["netcdf4"]

[project.scripts]
py_rdradcp-convert = "py_rdradcp.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_rdradcp"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
numpy = "*"
xarray = ">=2024.10"
netcdf4 = "*"
pytest = "*"
matplotlib = "*"
sphinx = ">=7"
myst-parser = "*"
furo = "*"

[tool.pixi.pypi-dependencies]
py_rdradcp = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest -q"
convert-example = "py_rdradcp-convert example_data/Bark26004r.000 example_data/Bark26004r.nc"
currents = "python examples/plot_currents.py"
docs = "sphinx-build -b html docs docs/_build/html"
